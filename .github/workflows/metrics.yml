name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]  # Обновление раз в сутки в 00:00
  workflow_dispatch:                  # Ручной запуск по кнопке
  push: { branches: ["master", "main"] }  # Обновление при пуше

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Разрешение на коммит результатов
    steps:
      - uses: lowlighter/metrics@latest  # Используй @master для новых фич
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: H1z3-br0
          
          # === БАЗОВЫЕ НАСТРОЙКИ ===
          config_timezone: Europe/Moscow
          config_theme: github_dark      # Темы: dark, radical, tokyonight, gruvbox
          config_display: columns        # columns / grid / flex
          config_octicon: yes            # Иконки
          config_animations: yes         # Анимации
          
          # === ПЛАГИНЫ ===
          # 🧱 Ядро + базовая статистика
          base: "header, activity, community, repositories, metadata"
          
          # 🈷️ Языки программирования
          plugin_languages: yes
          plugin_languages_ignored: html,css,scss,md  # Скрыть "шум"
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: github
          
          # 💡 Привычки кодинга
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_from: 365         # Дней анализа
          
          # 📓 Избранные репозитории
          plugin_repositories: yes
          plugin_repositories_featured: yes
          
          # ✨ Статистика звёзд
          plugin_stars: yes
          plugin_stars_limit: 10
          
          # 🎩 Заметный вклад в организации
          plugin_notable: yes
          plugin_notable_from: organization
          
          # 🧮 Трафик репозиториев (требует токен с repo scope)
          # plugin_traffic: yes
          
          # === ВЫВОД ===
          output_action: commit           # commit / pull-request / gist
          output: README.md               # Файл для обновления
          filename: github-metrics.svg    # Имя файла с метриками
